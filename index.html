<body>
    <h1>Principais Atalhos do Visual Studio Code</h1>
    <ul>
        <li><strong>Ctrl + P:</strong> Busca rápida de arquivos</li>
        <li><strong>Ctrl + Shift + P:</strong> Paleta de Comandos</li>
        <li><strong>Ctrl + ` :</strong> Abrir/Fechar Terminal</li>
        <li><strong>Ctrl + / :</strong> Comentar/Descomentar linha de código</li>
    </ul>
</body>
